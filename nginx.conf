# Servidor estatico de axiomaiatech.com (detras de Traefik en Dokploy, que termina TLS)
server_tokens off;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml text/xml;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    charset utf-8;

    # www -> dominio raiz
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-G50p3OQJdzmNSHgmrckkRv9E5DVGNkEspwW0gLrWXBE='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Recursos estaticos: cache de 7 dias (se invalida con ?v= en el HTML)
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Paginas: siempre revalidar; URLs limpias (/privacidad -> privacidad.html)
    location / {
        expires -1;
        try_files $uri $uri.html $uri/ =404;
    }

    location = /index.html { expires -1; }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
    }

    error_page 404 /404.html;
    location = /404.html { internal; expires -1; }
}
